# Gatilhos de intenção de alergia/restrição.
# Qualquer match aqui ativa o modo alergia: resposta restrita ao CSV + aviso fixo + handoff.
# Regra tolerante a acentos — comparar em lowercase e sem diacríticos.

gatilhos:
  - alergia
  - alergico
  - alérgico
  - alergias
  - intolerancia
  - intolerância
  - intolerante
  - gluten
  - glúten
  - celiaco
  - celíaco
  - celiaca
  - celíaca
  - lactose
  - diabetes
  - diabetico
  - diabético
  - diabetica
  - diabética
  - vegano
  - vegana
  - vegetariano
  - vegetariana
  - restricao
  - restrição
  - restricoes
  - restrições
  - sem acucar
  - sem açúcar
  - sem lactose
  - sem gluten
  - sem glúten
  - alergenico
  - alergênico
  - alergenicos
  - alergênicos
  - vestigio
  - vestígio
  - contaminacao
  - contaminação
  - maltitol
  - adocante
  - adoçante
  - pode conter

# Ingredientes que também aparecem em nomes de produto ("ao leite", "ovo de Páscoa",
# "drágea de castanha"). Só ativam o modo alergia quando a mensagem NÃO é o
# pedido de um produto do catálogo (ver respostaProduto em runAgent).
# "[produto] tem/leva [ingrediente]?" é pergunta de composição (alergia forte);
# "tem [produto]?" com o verbo no início é pedido de produto.
verbos_composicao: [tem, contem, contém, leva, possui, vai]

gatilhos_ingrediente:
  - leite
  - amendoim
  - castanha
  - avela
  - avelã
  - amendoa
  - amêndoa
  - oleaginosa
  - soja
  - ovo
  - ovos

